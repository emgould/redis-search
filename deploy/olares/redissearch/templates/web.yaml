apiVersion: v1
kind: Service
metadata:
  name: redissearch
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: redissearch
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  # App-to-app API (media-manager): see the api-forward container.
  - name: api
    port: 18080
    targetPort: 18080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redissearch
  namespace: {{ .Release.Namespace }}
  labels:
    app: redissearch
spec:
  replicas: {{ .Values.workloads.redissearch.replicaCount }}
  # Olares rejects RollingUpdate on Deployments that mount hostPath volumes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redissearch
  template:
    metadata:
      labels:
        app: redissearch
    spec:
      containers:
      - name: web
        image: {{ .Values.images.web }}
        imagePullPolicy: Never
        # Image CMD sources /secrets/env before starting uvicorn on $PORT.
        env:
        - name: PORT
          value: "8080"
        # Media Manager on this box, through its exposed port (see the mediamanager app's manifest).
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MEDIA_MANAGER_API_URL
          value: "http://$(HOST_IP):48098"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 4Gi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
      # IAP tunnel to public Redis; localhost:6381 matches the code's PUBLIC_REDIS_HOST/PORT defaults.
      # Literals, not values: Olares upgrades reuse the installed release's values, so new keys are nil.
      # media-manager SA needs roles/iap.tunnelResourceAccessor (port 6379) + compute.viewer on the VM.
      # No probes and a retry loop: an exited or unready container would mark the whole pod unready
      # and take the web UI down with public Redis.
      - name: public-redis-tunnel
        image: docker.io/library/redissearch-iap:olares
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - |
          while :; do
            gcloud compute start-iap-tunnel redis-stack-vm 6379 --local-host-port=localhost:6381 \
              --zone=us-central1-a --project=media-circle
            echo "IAP tunnel exited ($?); retrying in 15s"
            sleep 15
          done
        env:
        - name: CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
          value: /secrets/gcp-key.json
        - name: CLOUDSDK_CONFIG
          value: /tmp/gcloud
        - name: CLOUDSDK_CORE_DISABLE_PROMPTS
          value: "1"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
      # Olares' envoy sidecar sends all inbound traffic on the entrance pod through Authelia, which
      # rejects other apps (no session). Ports declared under OlaresManifest `ports` are exempt, so
      # other apps call 18080, relayed here to the app over loopback (not intercepted). The 8080
      # entrance keeps its login check, which guards access from outside the LAN.
      - name: api-forward
        image: docker.io/library/redissearch-iap:olares
        imagePullPolicy: Never
        command:
        - python
        - -c
        - |
          import asyncio

          async def pipe(reader, writer):
              try:
                  while data := await reader.read(65536):
                      writer.write(data)
                      await writer.drain()
              except OSError:
                  pass
              finally:
                  writer.close()

          async def handle(client_reader, client_writer):
              try:
                  app_reader, app_writer = await asyncio.open_connection("127.0.0.1", 8080)
              except OSError:
                  client_writer.close()
                  return
              await asyncio.gather(pipe(client_reader, app_writer), pipe(app_reader, client_writer))

          async def main():
              server = await asyncio.start_server(handle, "0.0.0.0", 18080)
              async with server:
                  await server.serve_forever()

          asyncio.run(main())
        ports:
        - containerPort: 18080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: secrets
        hostPath:
          path: {{ .Values.userspace.appData }}/config
          type: Directory
